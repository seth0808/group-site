<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>We Are Writing About Our Trip</title>
  <link rel="stylesheet" href="style.css" />
  <script src="data.js"></script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="site-header-rule">* * * * * * * * * *</div>
      <div class="site-name"><a href="index.html" id="site-name"></a></div>
      <p class="site-tagline" id="site-tagline"></p>
      <hr class="header-divider" />
    </header>

    <main>
      <p class="section-label">[ prompts ]</p>
      <ul class="prompt-list" id="prompt-list"></ul>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <script>
    function formatDate(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-US', {
        month: 'long', day: 'numeric', year: 'numeric'
      });
    }

    document.title = SITE.name;
    document.getElementById('site-name').textContent = SITE.name;
    document.getElementById('site-tagline').textContent = SITE.tagline;
    document.getElementById('site-footer').textContent =
      `[ last updated: ${new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' })} ]`;

    const list = document.getElementById('prompt-list');
    if (!PROMPTS.length) {
      list.innerHTML = '<li class="empty">// no prompts yet</li>';
    } else {
      list.innerHTML = PROMPTS.map(p => {
        const count = p.submissions.length;
        const label = count === 1 ? '1 submission' : `${count} submissions`;
        return `
          <li class="prompt-item">
            <a class="prompt-link" href="prompt.html#${encodeURIComponent(p.slug)}">
              <span class="prompt-title">${p.title}</span>
              <span class="prompt-right">
                <span class="prompt-meta">${formatDate(p.date)}</span>
                <span class="prompt-count">${label}</span>
              </span>
            </a>
          </li>`;
      }).join('');
    }
  </script>
</body>
</html>
