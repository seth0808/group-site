<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Naked</title>

<style>
:root {
    --paper: #f4efe5;
    --ink: rgba(31, 28, 24, 0.88);
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    min-height: 100%;
    background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.45), transparent 28%),
        linear-gradient(180deg, #f8f4ec 0%, var(--paper) 100%);
}

body {
    display: grid;
    place-items: center;
    padding: 32px;
    font-family: Georgia, "Times New Roman", serif;
}

.page {
    position: relative;
    width: min(1180px, 100%);
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: #f7f2e8;
    box-shadow: 0 18px 45px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
}

.page::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,0.22), transparent 35%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.12), transparent 30%);
    pointer-events: none;
}

.sketch {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: contrast(0.86) brightness(1.07) saturate(0.15);
    opacity: 0.86;
}

.wash {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            90deg,
            rgba(247,242,232,0.72) 0%,
            rgba(247,242,232,0.45) 28%,
            rgba(247,242,232,0.10) 55%,
            rgba(247,242,232,0.00) 100%
        );
}

.poem {
    position: absolute;
    left: 6%;
    top: 16%;
    color: var(--ink);
    max-width: 520px;
}

.title {
    margin-bottom: 42px;
    font-size: clamp(52px, 6vw, 80px);
    font-style: italic;
    font-weight: 400;
    letter-spacing: -0.04em;
}

.lines {
    font-size: clamp(24px, 2vw, 32px);
    line-height: 1.9;
}

.line {
    white-space: nowrap;
}

@media (max-width: 760px) {
    body { padding: 12px; }
    .page { aspect-ratio: 3 / 4; }

    .poem {
        left: 8%;
        top: 10%;
    }

    .line {
        white-space: normal;
    }
}
</style>
</head>

<body>
<div class="page">
    <img class="sketch" src="sketch.png" alt="Pencil sketch" />
    <div class="wash"></div>

    <div class="poem">
        <div class="title">Naked</div>

        <div class="lines">
            <div class="line">Warm wind kisses skin</div>
            <div class="line">Old friends together again</div>
            <div class="line">Bare without undress</div>
        </div>
    </div>
</div>
</body>
</html>
