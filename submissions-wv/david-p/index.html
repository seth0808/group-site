<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .player {
      opacity: 0;
      animation: emerge 2.4s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
      width: min(400px, 90vw);
    }

    @keyframes emerge {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="player">
    <iframe
      src="https://open.spotify.com/embed/playlist/5MxtQwzIHGdcsgHdzkE6dG?utm_source=generator&theme=0"
      width="100%"
      height="450"
      frameborder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy"
    ></iframe>
  </div>
</body>
</html>
