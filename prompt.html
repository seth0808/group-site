<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>We Are Writing About Our Trip</title>
  <link rel="stylesheet" href="style.css" />
  <script src="data.js"></script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="site-header-rule">* * * * * * * * * *</div>
      <div class="site-name"><a href="index.html" id="site-name"></a></div>
      <p class="site-tagline" id="site-tagline"></p>
      <hr class="header-divider" />
    </header>

    <main>
      <div class="prompt-page-header">
        <a class="back-link" href="index.html">all prompts</a>
        <h1 class="prompt-heading" id="prompt-heading"></h1>
        <p class="prompt-date" id="prompt-date"></p>
      </div>

      <p class="section-label">[ submissions ]</p>
      <ul class="submission-list" id="submission-list"></ul>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <script>
    function formatDate(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-US', {
        month: 'long', day: 'numeric', year: 'numeric'
      });
    }

    document.getElementById('site-name').textContent = SITE.name;
    document.getElementById('site-tagline').textContent = SITE.tagline;
    document.getElementById('site-footer').textContent =
      `[ last updated: ${new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' })} ]`;

    const slug = decodeURIComponent(location.hash.slice(1));
    const prompt = PROMPTS.find(p => p.slug === slug);

    if (!prompt) {
      document.getElementById('prompt-heading').textContent = '// prompt not found';
    } else {
      document.title = `${prompt.title} — ${SITE.name}`;
      document.getElementById('prompt-heading').textContent = prompt.title;
      document.getElementById('prompt-date').textContent = `launched: ${formatDate(prompt.date)}`;

      const list = document.getElementById('submission-list');
      if (!prompt.submissions.length) {
        list.innerHTML = '<li class="empty">// no submissions yet</li>';
      } else {
        list.innerHTML = prompt.submissions.map(s => `
          <li class="submission-item">
            <a class="submission-link" href="${s.file}">
              <span class="submission-title">${s.title}</span>
              <span class="submission-author">— ${s.author}</span>
            </a>
          </li>`).join('');
      }
    }
  </script>
</body>
</html>
